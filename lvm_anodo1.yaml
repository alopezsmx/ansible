-  name: Monta volumen
   hosts: anodo1
   become: true
   tasks:
     - name: Crea el directorio de montaje
       ansible.builtin.file:
         path: /mnt/datos
         state: directory
         mode: '0755'
     - name: extende el volumen fisico
       community.general.parted:
         device: /dev/nvme0n1p2
         resize: true         
     - name: extende el volumen fisico
       community.general.lvg:
         vg: lv_datos
         pvs: /dev/nvme0n1p2
         resize: true
     - name: Formatea el volumen lógico con el sistema de archivos xfs
       ansible.builtin.filesystem:
         fstype: xfs
         dev: /dev/almalinux/lv_datos
     - name: crea el montaje en fstab
       ansible.posix.mount:
          path: /mnt/datos
          src: /dev/almalinux/lv_datos
          fstype: xfs
          state: present
