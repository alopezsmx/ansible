- name : Instalar y configurar Apache
  hosts: nodos
  become: yes
  tasks:
  - name: Instalar httpd
    ansible.builtin.dnf:
      name: httpd
      state: present
      update_cache: yes
  - name: Iniciar y habilitar el servicio httpd
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: yes
  - name: Genera index.html
    ansible.builtin.copy:
      dest: /var/www/html/index.html
      content: "<h1>Bienvenido a {{ inventory_hostname }} - Administrado con Ansible</h1>"
      owner: apache
      group: apache
      mode: '0644'
